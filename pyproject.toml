[project]
name = "veritai"
version = "0.1.0"
description = "VeritAI: verificação de afirmações factuais do FOMO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
modelos = [
  "sentence-transformers>=5,<7",
  "transformers>=4.49,<6",
  "torch>=2.9,<3",
]
dev = ["pytest>=8,<10"]
# Notebook de avaliação (veritai-dados/avaliacao/avaliacao_veritai.ipynb); o serviço não depende disto.
notebook = ["pandas>=2,<4", "matplotlib>=3.8,<5", "ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6", "scikit-learn>=1.4,<2"]
# Notebook do modelo de relação no ASSIN 2 (modelo/treinar_e_avaliar.ipynb); o serviço não depende disto.
treino = [
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<4",
  "pyarrow>=17",
  "matplotlib>=3.9,<4",
  "jupyter>=1.1,<2",
]
# Ponte para o SageMaker (veritai/ponte.py) e script de deploy em deploy/aws/.
aws = ["boto3>=1.35,<2"]
# Site de embeddings (projetor/): ASSIN 2 em parquet e logs para o TensorBoard.
projetor = [
  "pandas>=2.2,<4",
  "pyarrow>=17",
  "tensorboard>=2.18,<3",
]

[project.scripts]
# O SageMaker inicia o container com `serve`.
serve = "veritai.api:servir"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["veritai", "veritai.base"]

[tool.setuptools.package-data]
veritai = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
