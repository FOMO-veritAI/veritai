# Site de embeddings (projetor/) no GitHub Pages: https://fomo-veritai.github.io/veritai/
# Gera os vetores com os modelos v0 e v1 (CPU) e publica o Embedding Projector do TensorFlow com eles.
name: Site de embeddings

on:
  push:
    branches: [main]
    paths: [projetor/**, veritai/modelos.py, veritai/config.json, eval/contraste.jsonl, .github/workflows/projetor.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('veritai/config.json') }}
      - run: python -m pip install "torch>=2.9,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[modelos,projetor]"
      - run: python projetor/gerar.py --saida _site
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
